# binocular ("bitfrost") config for the compose bench: regtest bitcoind +
# yaci-devkit via binocular's native `yaci` backend (BlockfrostProvider.localYaci).
# Field names are pureconfig kebab-case over oracle/CardanoConfig.scala et al.
# The oracle/relay/bridge identifiers are produced by the deploy steps of
# scenario 1 and land here via env substitution (${?VAR}) — unset is fine
# until the command that needs them runs.
binocular {
  bitcoin-node {
    url = "http://bitcoind:18443"
    username = "bifrost"
    password = "bifrost"
    network = "regtest"
  }

  cardano {
    network = "testnet" # yaci devnet (magic 42)
    backend = "yaci"
    yaci-store-url = "http://yaci-devkit:8080/api/v1"
    yaci-admin-url = "http://yaci-devkit:10000/local-cluster/api"
  }

  wallet {
    mnemonic = ${?WALLET_MNEMONIC}
  }

  relay {
    # tmtx ids come from `tm-script` output when the TM relay scenarios land.
    tmtx-policy-id = ${?TMTX_POLICY_ID}
    tmtx-asset-name = "TMTx"
    poll-interval = 5
    retry-interval = 10
  }

  oracle {
    tx-out-ref = ${?ORACLE_TX_OUT_REF} # printed by `init`
    owner-pkh = ${?ORACLE_OWNER_PKH}
    challenge-aging = 60
    maturation-confirmations = 3 # regtest: blocks are free, keep small
    # MUST equal the height `init --start-block` seeded from. Every later command
    # that rebuilds the confirmed-blocks MPF walks canonical headers from here, so
    # a mismatch is not a missing setting but a WRONG ROOT: the rebuild covers a
    # different range than the oracle committed to, and the failure is reported as
    # "Rebuilt MPF root does not match on-chain confirmedBlocksRoot ... likely
    # cause: a reorg", which sends you looking for a reorg that never happened.
    start-height = ${?ORACLE_START_HEIGHT}
    max-headers-per-tx = 40
    closure-timeout = 600
  }

  # Filled from `deploy-bridge` output. Every key below reads the SAME env var
  # name binocular's own reference.conf reads, so the scenario scripts export one
  # set of variables and never learn a bench-local alias. The values with no safe
  # default (the one-shot refs, the federation key, the deployment anchor) stay
  # unset until the step that produces them — deploy-bridge and confirm-tmtx each
  # refuse to run rather than guess, and that refusal is under test too.
  bridge {
    # MOUNTED (docker-compose ../onchain/plutus.json), not the sibling-checkout
    # path reference.conf defaults to.
    plutus-json = "/contracts/plutus.json"
    config-nft-policy-id = ${?CONFIG_NFT_POLICY_ID}
    config-nft-asset-name = "424946434647"
    bridged-token-policy-id = ${?BRIDGED_TOKEN_POLICY_ID}
    completed-peg-ins-one-shot-ref = ${?COMPLETED_PEG_INS_ONE_SHOT_REF}
    bridge-state-one-shot-ref = ${?BRIDGE_STATE_ONE_SHOT_REF}
    federation-one-shot-ref = ${?FEDERATION_ONE_SHOT_REF}
    # The genesis anchor: the Bitcoin treasury UTxO whose outpoint + amount the
    # singleton's bootstrap BridgeState records. deploy-bridge verifies both
    # against bitcoind before writing them ([DEP-2]).
    initial-btc-treasury-utxo = ${?INITIAL_BTC_TREASURY_UTXO}
    initial-btc-treasury-amount-sat = ${?INITIAL_BTC_TREASURY_AMOUNT_SAT}
    # Config #11 + params[7] + params[8]: with Y_51, the numbers that fix both
    # Taproot trees. Regtest-short so scenario 3 can mine past the CSV.
    y-federation-hex = ${?BIFROST_Y_FEDERATION_HEX}
    federation-csv-blocks = ${?BIFROST_FEDERATION_CSV_BLOCKS}
    pegin-refund-timeout-blocks = ${?BIFROST_PEGIN_REFUND_TIMEOUT_BLOCKS}
    # 1 sat/vB: regtest has no fee market, and a larger rate only eats the
    # treasury balance the assertions count.
    fee-rate-sat-per-vb = 1
    ban-schedule {
      base-ban-duration-ms = ${?BIFROST_BASE_BAN_DURATION_MS}
      max-faults-before-permanent = ${?BIFROST_MAX_FAULTS_BEFORE_PERMANENT}
      max-validity-window-ms = ${?BIFROST_MAX_VALIDITY_WINDOW_MS}
    }
  }
}
