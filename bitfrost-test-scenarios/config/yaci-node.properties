# Devnet genesis overrides, mounted at /app/config/node.properties (yaci-devkit's
# application.properties imports that path as `optional:`, and the DOCKER image
# ships no such file even though the distribution's own config sets nodeMode
# below — which is why the default has to be restated here).
#
# nodeMode=companion is what makes this devnet able to run protocol-version-11
# scripts at all. Left at the image's `haskell-only` fallback, `create-node`
# tries to raise the PV11 Plutus cost models by governance and NPEs
# (LocalNodeService.updateCostModels), signing off with "Extended builtins may
# not be available" — and it means it: the chain keeps the 251-entry PlutusV3
# table, costs every PV11 builtin as maxBound, and rejects the scripts binocular
# compiles with
#   "terminated part way through evaluation due to overspending the budget".
# The same NPE breaks the devkit faucet, and PlutusV2 goes missing from the
# published parameters. In companion mode the Yano bootstrap applies the cost
# models instead and all three symptoms go away.
# Upstream: bloxbean/yaci-devkit#184 (and #185 for the PlutusV2 half).
nodeMode=companion

# Selects WHICH cost models the bootstrap installs: GenesisUtil.resolveCostModelsFile
# reads this and loads /app/config/plutus-costmodels-v10.json or -v11.json. The
# node runs at PV11 regardless; this is about the tables that go with it.
protocolMajorVer=11
