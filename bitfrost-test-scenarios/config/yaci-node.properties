# Devnet genesis overrides, mounted at /app/config/node.properties (yaci-devkit's
# application.properties imports that path as `optional:`, and the image ships no
# such file).
#
# protocolMajorVer selects WHICH PLUTUS COST MODELS go into the genesis:
# GenesisUtil.resolveCostModelsFile reads it and loads
# /app/config/plutus-costmodels-v10.json or -v11.json. Left unset, 0.12.0-beta5
# builds a devnet that RUNS at protocol version 11 but carries the version-10
# cost models — a 251-entry PlutusV3 table where PV11 has 297. Nothing warns:
#   * `POST /local-cluster/api/addresses/topup` returns HTTP 500 "Topup failed"
#     (LocalProtocolParamSupplier.cborToCostModel NPEs on the absent table), and
#   * a client that costs its scripts for PV11 attaches ExUnits the node's own
#     evaluation then blows through, so every script transaction is rejected with
#     "terminated part way through evaluation due to overspending the budget".
# Both symptoms name the script, never the cost models.
protocolMajorVer=11
